<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fc"><title>全部會員 · CN</title>
<link rel="icon" href="./asset/favicon.ico"><link rel="stylesheet" href="./css/admin.css">
<link rel="stylesheet" href="./css/app-shell.css">
<link rel="stylesheet" href="./css/admin-members-ui.css?v=20261117-c5d1">
<script defer src="./js/app-shell.js"></script>
<script type="module" src="./js/admin-common.js"></script>
<script type="module" src="./js/admin-members.js?v=20261118-c7b7"></script>
</head><body data-page="members">
<div class="app-shell"><header class="app-header" id="appHeader"></header>
<main class="app-main admin-members-page">
<div class="app-intro"><h1>全部會員</h1><p>搜尋會員、檢視資料及管理基本資訊</p></div>
<section class="cn-panel member-search-panel" aria-labelledby="searchTitle"><div class="admin-summary"><h2 id="searchTitle">會員查詢</h2><button id="resetFilters" class="member-quiet-button" type="button">清除條件</button></div>
<form class="admin-filters" id="filters"><label>姓名或會員 ID<input id="query" type="search" placeholder="輸入姓名或會員 ID" autocomplete="off"></label>
<div class="member-filter-grid"><label>會員類型<select id="role"><option value="">全部類型</option><option value="non_member">一般會員</option><option value="lifestyle">生活會員</option><option value="distributor">直銷商</option></select></label>
<label>帳號狀態<select id="status"><option value="">全部狀態</option><option value="active">有效</option><option value="inactive">停用</option><option value="suspended">暫停</option></select></label></div>
<button type="submit" id="searchButton" class="member-search-button">查詢會員</button></form></section>
<section class="cn-panel member-results" aria-labelledby="resultsTitle"><div class="admin-summary"><h2 id="resultsTitle">查詢結果</h2><span id="count">—</span></div>
<p id="message" role="status">正在確認權限…</p><div class="admin-items" id="items"></div>
<div class="pager"><button id="previous" type="button" disabled>上一頁</button><span id="pageInfo">第 1 頁</span><button id="next" type="button" disabled>下一頁</button></div></section>
<div id="detailBackdrop" class="member-modal-backdrop" hidden></div>
<section id="memberDetail" class="member-detail member-detail-panel member-modal" role="dialog" aria-modal="true" hidden aria-labelledby="detailTitle">
<div class="member-detail-head"><div><h2 id="detailTitle">會員詳細資料</h2></div><button type="button" id="detailClose" class="member-quiet-button">關閉</button></div>
<div class="member-detail-tabs" role="tablist" aria-label="會員詳細資料分類">
<button type="button" id="memberTabBasic" role="tab" aria-selected="true" aria-controls="memberPanelBasic" tabindex="0">基本資料</button>
<button type="button" id="memberTabRelations" role="tab" aria-selected="false" aria-controls="memberPanelRelations" tabindex="-1">組織服務關係</button>
<button type="button" id="memberTabAudit" role="tab" aria-selected="false" aria-controls="memberPanelAudit" tabindex="-1">異動紀錄</button>
</div>
<div id="memberPanelBasic" role="tabpanel" aria-labelledby="memberTabBasic">
<p id="detailMessage" role="status"></p>
<form id="detailForm"><label>會員 ID<input id="detailId" readonly></label><label>安麗直銷商編號<input id="detailAmwayId" readonly></label><label>會員名稱<input id="detailName" maxlength="100" required></label><label>Email<input id="detailEmail" type="email" maxlength="254"></label><label>電話<input id="detailPhone" type="tel" maxlength="30"></label>
<div class="member-filter-grid"><label>會員類型<input id="detailRole" readonly></label></div>
<div id="detailSystemRoleArea" hidden>
<label for="detailSystemRole">系統角色
<select id="detailSystemRole" disabled><option value="">正在載入…</option></select>
</label>
<p id="detailSystemRoleNote" class="hierarchy-help" role="status"></p>
</div>
<fieldset id="detailStatusField" style="border:0;padding:0;margin:12px 0;min-width:0">
  <legend style="font-weight:600;margin-bottom:8px">帳號狀態</legend>
  <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <label style="display:inline-flex;align-items:center;gap:6px;width:auto"><input type="radio" name="detailStatus" value="active" disabled style="width:auto;margin:0">有效</label>
    <label style="display:inline-flex;align-items:center;gap:6px;width:auto"><input type="radio" name="detailStatus" value="inactive" disabled style="width:auto;margin:0">停用</label>
  </div>
</fieldset>
<p id="detailStatusNote" class="hierarchy-help" hidden>停用會員將撤銷目前有效的登入 Session。</p>
<label>建立時間<input id="detailCreated" readonly></label>
<div class="detail-actions"><button type="submit" id="detailSave" hidden>儲存變更</button></div></form></div>
<div id="memberPanelRelations" role="tabpanel" aria-labelledby="memberTabRelations" hidden>
<section id="relationshipPanel" class="relationship-panel" hidden aria-labelledby="relationshipTitle">
<h3 id="relationshipTitle">組織與服務關係</h3>
<p id="relationshipMessage" role="status"></p>
<div id="relationshipContent"></div>
<div id="relationshipActionBar" class="relationship-action-bar" hidden>
<button type="button" id="hierarchyEditToggle" class="member-quiet-button" hidden>修改上線</button>
<button type="button" id="serviceEditToggle" class="member-quiet-button" hidden>指派／更換</button>
<button type="button" id="serviceRemoveToggle" class="member-quiet-button" hidden>解除服務</button>
</div>
<div id="hierarchyEditSection" class="hierarchy-edit-section" hidden>
<form id="hierarchyEditForm" hidden>
<h4>修改直接上線</h4>
<p class="hierarchy-help">新上線必須是有效直銷商；不能指定自己或自己的下線。</p>
<label for="hierarchyParentSearch">搜尋新上線（姓名、會員 ID 或安麗編號）</label>
<div class="hierarchy-search-controls"><input id="hierarchyParentSearch" type="search" autocomplete="off" placeholder="輸入會員資料"><button type="button" id="hierarchyParentSearchButton" class="hierarchy-search-button">搜尋</button></div>
<p id="hierarchyParentSearchMessage" role="status"></p>
<div id="hierarchyParentResults" class="hierarchy-parent-results"></div>
<p id="hierarchySelectedParent" role="status">尚未選擇新上線</p>
<label class="hierarchy-checkbox" for="hierarchySyncService"><input type="checkbox" id="hierarchySyncService"><span>同步更新服務者<small>預設不勾選</small></span></label>
<label for="hierarchyReason">異動原因</label><textarea id="hierarchyReason" rows="3" maxlength="500" required placeholder="請說明修改原因"></textarea>
<div class="hierarchy-edit-actions"><button type="submit" id="hierarchySubmit" class="hierarchy-primary-button">確認修改</button><button type="button" id="hierarchyCancel" class="member-quiet-button">取消</button></div>
<p id="hierarchyEditMessage" role="status"></p>
</form></div>
<div id="serviceEditSection" class="hierarchy-edit-section" hidden>
<form id="serviceEditForm" hidden>
<h4 id="serviceEditTitle">指派服務者</h4>
<p class="hierarchy-help">服務關係與組織上線獨立管理；服務者須為有效直銷商。</p>
<div id="serviceSearchArea">
<label for="serviceSearch">搜尋服務者（姓名、會員 ID 或安麗編號）</label>
<div class="hierarchy-search-controls"><input id="serviceSearch" type="search" autocomplete="off" placeholder="輸入會員資料"><button type="button" id="serviceSearchButton" class="hierarchy-search-button">搜尋</button></div>
<p id="serviceSearchMessage" role="status"></p>
<div id="serviceSearchResults" class="hierarchy-parent-results"></div>
<p id="serviceSelected" class="service-selected" role="status">尚未選擇服務者</p>
</div>
<label for="serviceReason">異動原因</label><textarea id="serviceReason" rows="3" maxlength="500" required placeholder="請說明異動原因"></textarea>
<div class="hierarchy-edit-actions"><button type="submit" id="serviceSubmit" class="hierarchy-primary-button">確認修改</button><button type="button" id="serviceCancel" class="member-quiet-button">取消</button></div>
<p id="serviceEditMessage" role="status"></p>
</form>
</div>
</section></div>
<div id="memberPanelAudit" role="tabpanel" aria-labelledby="memberTabAudit" hidden>
<section class="relationship-panel" aria-labelledby="auditTitle"><h3 id="auditTitle">關係異動紀錄（最近 50 筆）</h3>
<p id="auditMessage" role="status"></p><div id="auditContent"></div></section>
</div></section>
</main><nav aria-label="主要導覽" class="bottom-nav" id="appFooter"></nav></div></body></html>
