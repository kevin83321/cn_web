<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CN 邀請註冊</title><style>body{font-family:system-ui,sans-serif;background:#f6f8fc;color:#152b4c;margin:0;padding:24px}main{max-width:480px;margin:7vh auto;background:white;padding:28px;border-radius:16px;box-shadow:0 6px 25px #17305212}label{display:block;margin:16px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #b8c4d6;border-radius:8px;font:inherit}button{background:#2458cb;color:white;border:0;border-radius:9px;padding:13px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.55}#inviteMessage{line-height:1.6}</style><link rel="stylesheet" href="./css/cn-polish.css"></head><body><main><h1>CN 會員邀請註冊</h1><p id="inviter"></p><p>填寫基本資料，驗證 Email 後完成註冊。LINE 綁定可稍後設定。</p><form id="inviteForm" hidden><label>顯示名稱<input id="inviteName" required maxlength="80" autocomplete="name"></label><label>Email<input id="inviteEmail" type="email" required autocomplete="email"></label><label>密碼（至少 12 字元）<input id="invitePassword" type="password" required minlength="12" autocomplete="new-password"></label><label>確認密碼<input id="invitePassword2" type="password" required minlength="12" autocomplete="new-password"></label><button id="inviteSubmit" type="submit">寄送 Email 驗證信</button></form><p id="inviteMessage" role="status"></p><a href="./index.html">返回首頁</a></main><script src="./js/invite-register.js" defer></script></body></html>
