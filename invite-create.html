<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>產生邀請連結｜CN</title><link rel="stylesheet" href="./css/cn-polish.css"><style>
body{font-family:system-ui,sans-serif;background:#f6f8fc;color:#152b4c;margin:0;padding:20px}main{max-width:550px;margin:5vh auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 6px 25px #17305212}label{display:block;margin:16px 0;font-weight:600}input[type=text],input[type=search]{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:8px;border:1px solid #b8c4d6;border-radius:8px;font:inherit}button{padding:12px 18px;border:0;border-radius:9px;background:#2458cb;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}fieldset{border:1px solid #dbe4f1;border-radius:12px}fieldset label{font-weight:400}#inviteResult{margin-top:20px;padding:16px;border:1px solid #dbe4f1;border-radius:12px}#inviteUrlText{overflow-wrap:anywhere;background:#f6f8fc;padding:12px}#inviteLinkOutput,#inviteShareMessage{min-height:1.5em;line-height:1.5}button.secondary{background:#edf2fa;color:#2458cb}.actions{display:flex;flex-wrap:wrap;gap:8px}small{color:#64748b}[hidden]{display:none!important}
</style></head><body><main><h1>產生邀請連結</h1><p>請選擇邀請類型，系統會產生對應的註冊或認領連結。</p>
<fieldset><legend>邀請類型</legend><label><input type="radio" name="inviteType" value="member" checked> 邀請新會員（建立新會員資料）</label><label><input type="radio" name="inviteType" value="claim"> 邀請既有客戶（認領原有帳號）</label></fieldset>
<section id="claimFields" hidden><label for="customerId">客戶會員 ID<input id="customerId" type="text" maxlength="100" autocomplete="off" placeholder="可從客戶管理頁面帶入"></label><p id="customerInfo" role="status"></p><small>只可替授權組織範圍內、尚未啟用登入的客戶建立認領邀請。</small></section>
<button id="createInviteButton" type="button">產生邀請連結</button><p id="inviteLinkOutput" role="status"></p>
<section id="inviteResult" hidden><h2>專屬邀請連結</h2><div id="inviteUrlText"></div><p><small>此連結包含一次性憑證，請只傳送給指定對象。</small></p><div class="actions"><button id="copyInviteButton" type="button">複製連結</button><button id="lineShareButton" type="button">LINE 分享</button><button id="nativeShareButton" class="secondary" type="button">其他分享</button><button id="copyInviteTextButton" class="secondary" type="button">複製邀請文字</button></div><p id="inviteShareMessage" role="status"></p></section>
<p><a href="./index.html">返回會員中心</a></p></main><script type="module" src="./js/invite-link.js"></script></body></html>
