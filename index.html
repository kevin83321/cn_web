
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>GitHub Pages + GAS API Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f6fa;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #111827;
      color: #d1fae5;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h2>GitHub Pages + GAS API Test</h2>

  <div class="card">
    <label>GAS Web App URL</label>
    <input id="apiUrl"
           placeholder="https://script.google.com/macros/s/.../exec">

    <button onclick="testGet()">Test GET</button>
    <button onclick="testPost()">Test POST</button>
  </div>

  <div class="card">
    <h3>Response</h3>
    <pre id="result">Waiting...</pre>
  </div>

<script>
const output = document.getElementById("result");

function show(value) {
  output.textContent =
    typeof value === "string"
      ? value
      : JSON.stringify(value, null, 2);
}

function getApiUrl() {
  const url = document.getElementById("apiUrl")
    .value.trim();

  if (!url.startsWith("https://")) {
    throw new Error("請輸入 HTTPS GAS URL");
  }

  return url;
}

async function testGet() {
  show("Testing GET...");

  try {
    const url = new URL(getApiUrl());
    url.searchParams.set("action", "ping");

    const response = await fetch(url.toString(), {
      method: "GET",
      redirect: "follow"
    });

    const text = await response.text();

    show({
      status: response.status,
      ok: response.ok,
      body: text
    });

  } catch (error) {
    show({
      success: false,
      type: "GET_ERROR",
      message: error.message
    });
    console.error(error);
  }
}

async function testPost() {
  show("Testing POST...");

  try {
    const response = await fetch(getApiUrl(), {
      method: "POST",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "echo",
        member_id: "M001",
        message: "Hello GAS",
        timestamp: new Date().toISOString()
      })
    });

    const text = await response.text();

    show({
      status: response.status,
      ok: response.ok,
      body: text
    });

  } catch (error) {
    show({
      success: false,
      type: "POST_ERROR",
      message: error.message
    });
    console.error(error);
  }
}
</script>

</body>
</html>
