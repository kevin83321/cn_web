<!DOCTYPE html>

<html lang="zh-Hant">
<head><script defer="" src="./js/app-shell.js?v=20261104-3"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>客戶服務管理</title>
<link href="./css/customer-management.css" rel="stylesheet"/>
<script defer="" src="./js/customer-management.js"></script>
<link href="./css/app-shell.css?v=20261104-3" rel="stylesheet"/>
<link rel="stylesheet" href="./css/cn-polish.css">
</head>
<body data-page="customers">
<div class="app-shell"><header class="app-header" id="appHeader"></header><main class="wrap app-main"><div class="app-intro"><span class="cn-eyebrow">MEMBER SERVICE</span><h1>服務客戶</h1><p>快速查詢、指派及管理服務關係</p></div>
<p>服務客戶與會員上下線分開管理。指派、轉移及結束服務會更新 D1 資料。</p>
<section aria-labelledby="manageHeading" class="card">
<h2 id="manageHeading">服務關係管理</h2>
<p id="permissionMessage" role="status">正在確認操作權限…</p>
<form id="manageForm">
<div class="form-grid">
<label>操作
          <select id="operation" required="">
<option value="assign">指派服務</option>
<option value="transfer">轉移服務</option>
<option value="end-service">結束服務</option>
</select>
</label>
<label>客戶會員 ID
          <input autocomplete="off" id="customerId" maxlength="100" placeholder="例如 CUSTOMER001" required=""/>
</label>
<label id="distributorField">服務直銷商會員 ID
          <input autocomplete="off" id="distributorId" maxlength="100" placeholder="例如 DIST001"/>
</label>
</div>
<p class="hint" id="operationHint">指派尚未有有效服務關係的客戶。</p>
<button disabled="" id="submitAction" type="submit">確認指派</button>
<p id="actionMessage" role="status"></p>
</form>
</section>
<section aria-labelledby="listHeading">
<h2 id="listHeading">目前服務客戶</h2>
<div class="actions">
<button id="reload" type="button">重新載入</button>
<input aria-label="搜尋客戶" id="search" placeholder="搜尋客戶姓名、ID、服務直銷商" type="search"/>
</div>
<p id="message" role="status">準備載入資料…</p>
<p id="count"></p>
<div class="table-wrap">
<table>
<thead><tr><th>客戶姓名</th><th>客戶 ID</th><th>會員類型</th><th>服務直銷商 ID</th><th>建立時間</th><th>操作</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
<section hidden="" id="historyPanel">
<h2>服務關係歷史</h2>
<p id="historyMessage" role="status"></p>
<div class="table-wrap">
<table>
<thead><tr><th>服務 ID</th><th>服務直銷商</th><th>狀態</th><th>建立時間</th></tr></thead>
<tbody id="historyRows"></tbody>
</table>
</div>
</section>
</main><nav aria-label="主要導覽" class="bottom-nav" id="appFooter"></nav></div>
</body>
</html>
