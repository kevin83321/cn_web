<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>系統角色與權限 · CN</title>
<link rel="stylesheet" href="./css/app-shell.css"><link rel="stylesheet" href="./css/admin-members-phase6.css"><link rel="stylesheet" href="./css/admin-roles.css"><link rel="stylesheet" href="./css/cn-polish.css"><link rel="stylesheet" href="./css/admin-roles-ui.css?v=20261111-961">
<script defer src="./js/app-shell.js"></script><script type="module" src="./js/admin-roles.js?v=20261111-96"></script><link rel="icon" href="./asset/favicon.ico">
</head>
<body data-page="admin-roles"><div class="app-shell"><header class="app-header" id="appHeader"></header><main class="app-main">
<div class="app-intro"><span class="cn-eyebrow">ADMINISTRATION</span><h1>系統角色與權限</h1><p>管理角色、檢視權限及設定系統存取範圍</p></div>
<div class="role-tabs" role="tablist" aria-label="角色管理功能"><button id="tabRoles" type="button" role="tab" aria-controls="rolesPanel" aria-selected="true">角色與權限</button><button id="tabCreate" type="button" role="tab" aria-controls="createPanel" aria-selected="false" hidden>新增角色</button></div>
<div id="rolesPanel" role="tabpanel" aria-labelledby="tabRoles">
<section class="cn-panel" id="roleCatalog"><div class="role-section-heading"><div><h2>角色清單</h2><p class="role-muted">選擇角色後查看權限設定</p></div><button type="button" id="reloadRoles" class="role-secondary">重新整理</button></div><p id="notice" role="status" aria-live="polite">正在確認權限…</p><div id="roles" class="role-list"></div></section>
<section class="cn-panel" id="editSection" hidden><div class="role-section-heading"><div><h2 id="editTitle">角色權限</h2><p id="editInfo" class="role-muted"></p></div><button type="button" id="closeRole" class="role-secondary">返回清單</button></div><p id="permissionSummary" class="role-muted"></p><form id="permissionForm"><div id="permissionOptions" class="permission-options"></div><div class="role-actions"><button id="saveButton" type="submit" hidden>儲存權限設定</button></div></form><p id="editMessage" role="status" aria-live="polite"></p></section>
</div><div id="createPanel" role="tabpanel" aria-labelledby="tabCreate" hidden><section class="cn-panel" id="createSection" hidden><h2>新增系統角色</h2><p class="role-muted">角色代碼建立後不可修改</p><form id="createForm" class="role-form"><label>角色代碼<input id="roleCode" pattern="[a-z][a-z0-9_]{2,63}" maxlength="64" placeholder="customer_service" required></label><label>顯示名稱<input id="roleName" maxlength="80" placeholder="客服人員" required></label><label>說明<textarea id="roleDescription" maxlength="500" rows="2"></textarea></label><button type="submit" id="createButton">建立角色</button></form></section></div>
</main><nav aria-label="主要導覽" class="bottom-nav" id="appFooter"></nav></div></body></html>
