<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAS Login POC</title><style>body{font-family:system-ui;max-width:620px;margin:50px auto;padding:16px;background:#f4f6fa}main{background:white;padding:24px;border-radius:12px}input,button{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px}button{background:#225bd7;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172032;color:#e0f1eb;padding:15px;border-radius:8px}.hidden{display:none}</style></head><body><main><h2>GitHub Pages + GAS 登入 POC</h2><label>GAS Web App /exec URL<input id="url" placeholder="https://script.google.com/macros/s/.../exec"></label><section id="login"><label>帳號<input id="username" value="demo01" autocomplete="username"></label><label>密碼<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn">登入</button></section><section id="private" class="hidden"><h3>登入成功</h3><button id="meBtn">驗證 Session / 讀取個人資料</button><button id="logoutBtn">登出</button></section><pre id="out">等待操作</pre></main><script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('demo_session')||'';
$('url').value=localStorage.getItem('demo_api_url')||'';
function show(v){$('out').textContent=JSON.stringify(v,null,2)}
function view(auth){$('login').classList.toggle('hidden',auth);$('private').classList.toggle('hidden',!auth)}
async function api(data){const url=$('url').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url))throw Error('請輸入有效的 GAS /exec URL');localStorage.setItem('demo_api_url',url);const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data),redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}
$('loginBtn').onclick=async()=>{try{const r=await api({action:'login',username:$('username').value,password:$('password').value});$('password').value='';if(r.success){token=r.token;sessionStorage.setItem('demo_session',token);view(true);show({success:true,member:r.member,expires_at:r.expires_at})}else show(r)}catch(e){show({error:e.message})}};
$('meBtn').onclick=async()=>{try{const r=await api({action:'me',token});show(r);if(!r.success){token='';sessionStorage.removeItem('demo_session');view(false)}}catch(e){show({error:e.message})}};
$('logoutBtn').onclick=async()=>{try{show(await api({action:'logout',token}))}catch(e){show({error:e.message})}finally{token='';sessionStorage.removeItem('demo_session');view(false)}};
(async()=>{if(token){try{const r=await api({action:'me',token});if(r.success){view(true);show(r);return}}catch(e){show({error:e.message})}token='';sessionStorage.removeItem('demo_session')}view(false)})();
</script></body></html>
