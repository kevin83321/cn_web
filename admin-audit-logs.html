<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc">
  <title>操作紀錄 · CN</title>
  <link rel="stylesheet" href="./css/admin.css"><link rel="stylesheet" href="./css/cn-polish.css"><link rel="stylesheet" href="./css/app-shell.css?v=20261104-3"><link rel="stylesheet" href="./css/admin-audit-logs-ui.css?v=20261111-971">
  <link rel="icon" href="./asset/favicon.ico">
  <script defer src="./js/app-shell.js?v=20261104-3"></script>
  <script type="module" src="./js/admin-audit-logs.js?v=20261111-971"></script>
</head>
<body data-page="audit"><div class="app-shell"><header class="app-header" id="appHeader"></header>
<main class="app-main">
 <div class="app-intro"><h1>操作紀錄</h1><p>查詢系統操作與稽核紀錄</p></div>
 <section class="cn-panel audit-panel"><form id="filters" class="admin-filters audit-filters">
  <label>操作人員<select id="actor" aria-label="操作人員"><option value="">全部操作人員</option></select></label>
  <label>操作類型<select id="action" aria-label="操作類型"><option value="">全部操作類型</option></select></label>
  <div class="audit-actions"><button id="searchButton" type="submit">查詢</button><button id="resetFilters" type="button" class="audit-secondary">清除條件</button></div>
 </form><p class="audit-hint" id="filterHint">從下拉選單選擇篩選條件；選擇「全部」則不限制該欄位。</p></section>
 <section class="cn-panel audit-panel"><div class="admin-summary"><h2>查詢結果</h2><span id="count">—</span></div>
 <p id="message" role="status" aria-live="polite">正在確認權限…</p><div id="items" class="admin-items audit-items"></div>
 <div class="pager"><button id="previous" type="button" disabled>上一頁</button><span id="pageInfo">第 1 頁</span><button id="next" type="button" disabled>下一頁</button></div>
 </section>
</main><nav aria-label="主要導覽" class="bottom-nav" id="appFooter"></nav></div></body></html>
