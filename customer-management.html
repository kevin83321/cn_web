<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>客戶服務管理</title><link rel="stylesheet" href="./customer-management.css"><script src="./customer-management.js" defer></script></head>
<body><main class="wrap"><header><h1>客戶服務管理</h1><a href="./index.html">返回會員中心</a></header>
<p>顯示目前登入直銷商及其下線的有效服務客戶；客戶服務與上下線組織分開管理。</p>
<div class="actions"><button id="reload" type="button">重新載入</button><input id="search" type="search" placeholder="搜尋客戶姓名、ID、服務直銷商" aria-label="搜尋客戶"></div>
<p id="message" role="status">準備載入資料…</p><p id="count"></p>
<div class="table-wrap"><table><thead><tr><th>客戶姓名</th><th>客戶 ID</th><th>會員類型</th><th>服務直銷商 ID</th><th>建立時間</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<section id="historyPanel" hidden><h2>服務關係歷史</h2><p id="historyMessage"></p><div class="table-wrap"><table><thead><tr><th>服務 ID</th><th>服務直銷商</th><th>狀態</th><th>建立時間</th></tr></thead><tbody id="historyRows"></tbody></table></div></section>
</main></body></html>
