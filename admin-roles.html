<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>系統角色與權限 · CN</title><link rel="stylesheet" href="./css/app-shell.css"><link rel="stylesheet" href="./css/admin-members-phase6.css"><link rel="stylesheet" href="./css/admin-roles.css"><link rel="stylesheet" href="./css/cn-polish.css"><script defer src="./js/app-shell.js"></script><script type="module" src="./js/admin-roles.js"></script></head>
<body data-page="admin-roles"><div class="app-shell"><header class="app-header" id="appHeader"></header><main class="app-main"><div class="app-intro"><span class="cn-eyebrow">ADMINISTRATION</span><h1>系統角色與權限</h1><p>建立角色並設定可使用的系統功能</p></div>
<section class="cn-panel"><h2>角色清單</h2><p id="notice" role="status" aria-live="polite">正在確認權限…</p><div id="roles"></div></section>
<section class="cn-panel" id="createSection" hidden><h2>新增系統角色</h2><form id="createForm" class="role-form"><label>角色代碼（建立後不可修改）<input id="roleCode" pattern="[a-z][a-z0-9_]{2,63}" maxlength="64" placeholder="customer_service" required></label><label>顯示名稱<input id="roleName" maxlength="80" placeholder="客服人員" required></label><label>說明<textarea id="roleDescription" maxlength="500" rows="2"></textarea></label><button type="submit" id="createButton">建立角色</button></form></section>
<section class="cn-panel" id="editSection" hidden><h2 id="editTitle">角色權限</h2><p id="editInfo"></p><form id="permissionForm"><div id="permissionOptions" class="permission-options"></div><button id="saveButton" type="submit" hidden>儲存權限設定</button></form><p id="editMessage" role="status" aria-live="polite"></p></section>
</main><nav aria-label="主要導覽" class="bottom-nav" id="appFooter"></nav></div></body></html>
