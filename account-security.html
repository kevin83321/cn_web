<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入與安全設定｜CN</title><link rel="stylesheet" href="./css/account-security.css"><script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script defer src="./js/app-shell.js"></script><script defer src="./js/account-security.js"></script></head>
<body data-page="security"><div class="app-shell"><header id="appHeader"></header><main class="security-main"><h1>登入與安全設定</h1><p id="message" role="status" aria-live="polite">正在載入…</p>
<section class="panel"><h2>登入方式</h2><dl><dt>帳號</dt><dd id="identifier">—</dd><dt>密碼登入</dt><dd id="passwordStatus">—</dd><dt>LINE 綁定</dt><dd id="lineStatus">—</dd></dl><div class="actions"><button type="button" id="bindLine">綁定 LINE</button><button type="button" id="unbindLine" class="secondary">解除 LINE 綁定</button></div><p class="hint">LINE 綁定與解除綁定都需要目前的帳號密碼；解除綁定將撤銷其他裝置的 Session。</p></section>
<section class="panel"><h2>修改登入密碼</h2><form id="passwordForm"><label>目前密碼<input name="current" type="password" autocomplete="current-password" required></label><label>新密碼<input name="next" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>確認新密碼<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p class="hint">至少 12 字元，需包含英文大寫、小寫、數字與特殊符號。</p><button type="submit">更新密碼</button></form></section>
<section class="panel"><h2>登入裝置與 Session</h2><p class="hint">列出目前有效的登入工作階段，最後活動時間可能延遲約 5 分鐘。既有 Session 的裝置資訊可能顯示未知。</p><div class="actions"><button type="button" id="refreshSessions" class="secondary">重新整理</button><button type="button" id="revokeOtherSessions">登出其他所有裝置</button></div><p id="sessionsMessage" role="status" aria-live="polite"></p><div id="sessionList" class="session-list"></div></section></main><nav id="appFooter"></nav></div></body></html>
