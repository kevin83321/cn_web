<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>認領客戶帳號｜CN</title><link rel="icon" type="image/x-icon" href="./asset/favicon.ico"><link rel="stylesheet" href="./css/cn-polish.css"><style>body{font-family:system-ui,sans-serif;background:#f6f8fc;color:#152b4c;margin:0;padding:20px}main{max-width:480px;margin:7vh auto;padding:28px;border-radius:16px;background:#fff;box-shadow:0 6px 25px #17305212}label{display:block;margin:16px 0;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;margin-top:7px;border:1px solid #b8c4d6;border-radius:9px;font:inherit}button{padding:12px 18px;border:0;border-radius:9px;background:#2458cb;color:#fff;font:inherit}button:disabled{opacity:.5}p{line-height:1.6}[hidden]{display:none!important}</style></head><body><main><h1>認領 CN 客戶帳號</h1><p id="claimInfo">正在確認邀請連結…</p><form id="claimForm" hidden><label>Email<input id="claimEmail" type="email" maxlength="254" autocomplete="email" required></label><label>設定密碼（12–128 字元）<input id="claimPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>確認密碼<input id="claimPassword2" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button id="claimSubmit" type="submit">寄送 Email 驗證信</button></form><p id="claimMessage" role="status"></p><a href="./index.html">返回會員中心</a></main><script type="module" src="./js/claim-account.js"></script></body></html>
