
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <title>邀請新會員｜CN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f6f8fc;
      color: #152b4c;
      margin: 0;
      padding: 24px;
    }

    main {
      max-width: 500px;
      margin: 6vh auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 6px 25px #17305212;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 12px;
    }

    p {
      line-height: 1.7;
      color: #61718a;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .primary {
      background: #2458cb;
      color: white;
    }

    .secondary {
      background: #eef3fc;
      color: #2458cb;
    }

    .line-button {
      background: #06c755;
      color: white;
    }

    .full-width {
      width: 100%;
    }

    .invite-result {
      margin-top: 24px;
      padding: 18px;
      border: 1px solid #e2e9f3;
      border-radius: 14px;
      background: #fbfcff;
    }

    .result-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .invite-link {
      padding: 12px;
      background: white;
      border: 1px solid #e2e9f3;
      border-radius: 10px;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.6;
      color: #2458cb;
      user-select: all;
    }

    .share-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .share-grid button {
      min-width: 0;
    }

    .share-extra {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .hint {
      font-size: 12px;
      color: #7c8aa0;
      margin-top: 12px;
    }

    .message {
      margin-top: 14px;
      font-size: 13px;
      min-height: 20px;
    }

    .message.success {
      color: #16803c;
    }

    .message.error {
      color: #c0392b;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #2458cb;
      text-decoration: none;
      font-weight: 600;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 380px) {
      body {
        padding: 12px;
      }

      main {
        padding: 20px;
      }

      .share-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="./css/cn-polish.css">
</head>

<body>
<main>
  <h1>邀請新會員</h1>

  <p>
    產生專屬邀請連結，分享給想邀請的朋友。
    對方完成 Email 驗證後，即可建立會員帳號。
  </p>

  <button
    id="createInviteButton"
    class="primary full-width"
    type="button">
    產生邀請連結
  </button>

  <p id="inviteLinkOutput" class="message" role="status"></p>

  <section id="inviteResult" class="invite-result" hidden>
    <div class="result-title">專屬邀請連結</div>

    <div id="inviteUrlText" class="invite-link"></div>

    <p class="hint">
      此連結有效期限為 7 天，僅能完成一次註冊。
      請勿公開張貼或轉傳給不相關的人。
    </p>

    <div class="share-grid">
      <button
        id="copyInviteButton"
        class="primary"
        type="button">
        📋 複製連結
      </button>

      <button
        id="lineShareButton"
        class="line-button"
        type="button">
        LINE 分享
      </button>
    </div>

    <div class="share-extra">
      <button
        id="nativeShareButton"
        class="secondary"
        type="button">
        ↗ 分享到其他 App
      </button>

      <button
        id="copyInviteTextButton"
        class="secondary"
        type="button">
        複製完整邀請文字
      </button>
    </div>

    <p id="inviteShareMessage"
       class="message"
       role="status"></p>
  </section>

  <a href="./index.html" class="back-link">
    ← 返回會員中心
  </a>
</main>

<script src="./js/invite-link.js" defer></script>
</body>
</html>
